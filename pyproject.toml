[project]
name = "data-breach-disclosure-timing"
version = "0.1.0"
description = "Analysis of market reactions to data breach disclosures using event study methodology"
authors = [{name = "Timothy D. Spivey", email = "ts2427@jagmail.southalabama.edu"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
keywords = ["data-breach", "event-study", "financial-analysis", "machine-learning"]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "scipy>=1.11.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "shap>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "ipython>=8.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "jupyter>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
